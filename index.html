<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Build & Battle — レギュレーション制ビルドSRPG風マルチプレイ"
    />
    <!-- リポジトリ Pages（/Build_And_battle/）でもルートでも相対解決できるよう動的に base を付与 -->
    <script>
      (function () {
        var parts = location.pathname.split('/').filter(Boolean)
        // file:// or / → base ./
        // /Build_And_battle/ or /Build_And_battle/index.html → /Build_And_battle/
        var base = './'
        if (location.protocol !== 'file:' && parts.length > 0) {
          var repo = parts[0]
          if (location.pathname.indexOf('/' + repo + '/') === 0 || parts.length === 1) {
            base = '/' + repo + '/'
          }
        }
        var el = document.createElement('base')
        el.href = base
        document.head.prepend(el)
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="app/main.css" />
    <title>Build & Battle</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- ビルド済み ESM。npm run build で再生成。リポジトリにコミットするので Pages はビルド不要 -->
    <script type="module" src="app/main.js"></script>
  </body>
</html>
